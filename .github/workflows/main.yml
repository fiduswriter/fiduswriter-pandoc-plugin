name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: github.server_url == 'https://github.com'
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install pip --upgrade
          pip install https://github.com/fiduswriter/fiduswriter-server-backend/archive/main.zip
          pip install "https://github.com/fiduswriter/fiduswriter-books-plugin/archive/develop.zip" \
            || pip install "https://github.com/fiduswriter/fiduswriter-books-plugin/archive/main.zip"
      - uses: pre-commit/action@v3.0.1
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chrome (Forgejo runners)
        if: github.server_url != 'https://github.com'
        run: |
            apt-get update
            apt-get install -y wget gnupg ca-certificates
            wget -q -O /tmp/google-chrome.gpg https://dl.google.com/linux/linux_signing_key.pub
            gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
            apt-get update
            apt-get install -y google-chrome-stable
      - name: Set up Python
        uses: actions/setup-python@v6
        if: github.server_url == 'https://github.com'
        with:
          python-version: "3.14"
      - uses: actions/checkout@v6
      - uses: nanasess/setup-chromedriver@v3
      - name: Install dependencies
        run: |
          pip install requests[security]
          pip install coverage
          pip install coveralls
          pip install packaging
          pip install webdriver-manager
          pip install selenium
          pip install wheel
          pip install pip --upgrade
          pip install https://github.com/fiduswriter/fiduswriter-server-backend/archive/main.zip
          pip install "https://github.com/fiduswriter/fiduswriter-books-plugin/archive/develop.zip" \
            || pip install "https://github.com/fiduswriter/fiduswriter-books-plugin/archive/main.zip"
          cd fiduswriter
          mv ../ci/configuration.py ./
          mv ../ci/.coveragerc ./
          coverage run --concurrency=multiprocessing,thread $(which fiduswriter) setup --no-static
      - name: Run test pandoc
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: |
            cd fiduswriter
            coverage run --concurrency=multiprocessing,thread $(which fiduswriter) test pandoc
      - name: Upload failed test screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure-artifacts
          path: ${{ github.workspace }}/fiduswriter/screenshots/
      - name: Coveralls
        if: github.server_url == 'https://github.com'
        run: |
          cd fiduswriter
          coverage combine
          coveralls --service=github
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
